  /api/v1/dashboard:
    get:
      summary: Calculate scoped metrics for an inclusive period
      parameters:
        - name: from
          in: query
          required: true
          schema: {type: string, format: date}
        - name: through
          in: query
          required: true
          schema: {type: string, format: date}
      responses:
        '200': {description: Successful request}
        '503': {description: Local database or service unavailable}
