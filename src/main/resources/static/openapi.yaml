openapi: 3.1.0
info:
  title: TalentCompass Local API
  version: 0.3.0
  description: Session-backed operations served on the same local origin as the browser application.
security:
  - sessionCookie: []
paths:
  /health:
    get:
      summary: Backend and database readiness
      security: []
      responses:
        '200': {description: Successful request}
        '503': {description: Local database or service unavailable}
  /api/v1/login:
    post:
      summary: Sign in with a local organization account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '200': {description: Successful request}
        '503': {description: Local database or service unavailable}
        '400': {description: Invalid input}
        '401': {description: Sign-in required or invalid login}
        '403': {description: Action outside the account scope or invalid confirmation token}
        '409': {description: Conflicting record, duplicate identifier or invalid linked record}
  /api/v1/session:
    get:
      summary: Get the current account and confirmation token
      responses:
        '200': {description: Successful request}
        '503': {description: Local database or service unavailable}
        '400': {description: Invalid input}
        '401': {description: Sign-in required or invalid login}
        '403': {description: Action outside the account scope or invalid confirmation token}
  /api/v1/logout:
    post:
      summary: End the session
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '200': {description: Successful request}
        '503': {description: Local database or service unavailable}
        '400': {description: Invalid input}
        '401': {description: Sign-in required or invalid login}
        '403': {description: Action outside the account scope or invalid confirmation token}
        '409': {description: Conflicting record, duplicate identifier or invalid linked record}
  /api/v1/accounts:
    get:
      summary: List local accounts (HR Admin)
      responses:
        '200': {description: Successful request}
        '503': {description: Local database or service unavailable}
        '400': {description: Invalid input}
        '401': {description: Sign-in required or invalid login}
        '403': {description: Action outside the account scope or invalid confirmation token}
    post:
      summary: Provision a local account (HR Admin)
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountInput'
      responses:
        '200': {description: Successful request}
        '503': {description: Local database or service unavailable}
        '400': {description: Invalid input}
        '401': {description: Sign-in required or invalid login}
        '403': {description: Action outside the account scope or invalid confirmation token}
        '409': {description: Conflicting record, duplicate identifier or invalid linked record}
  /api/v1/accounts/{username}/deactivate:
    parameters:
      - name: username
        in: path
        required: true
        schema: {type: string}
    post:
      summary: Deactivate an account (HR Admin)
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '200': {description: Successful request}
        '503': {description: Local database or service unavailable}
        '400': {description: Invalid input}
        '401': {description: Sign-in required or invalid login}
        '403': {description: Action outside the account scope or invalid confirmation token}
        '409': {description: Conflicting record, duplicate identifier or invalid linked record}
  /api/v1/accounts/{username}/assignment:
    parameters:
      - name: username
        in: path
        required: true
        schema: {type: string}
    put:
      summary: Change an active local account assignment (HR Admin)
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: {type: string}
                departmentId: {type: string}
      responses:
        '200': {description: Assignment changed}
        '403': {description: HR Admin and a confirmation token are required}
  /api/v1/departments:
    get:
      summary: List departments in scope
      responses:
        '200': {description: Successful request}
        '503': {description: Local database or service unavailable}
        '400': {description: Invalid input}
        '401': {description: Sign-in required or invalid login}
        '403': {description: Action outside the account scope or invalid confirmation token}
    post:
      summary: Create a department (HR Admin)
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentInput'
      responses:
        '200': {description: Successful request}
        '503': {description: Local database or service unavailable}
        '400': {description: Invalid input}
        '401': {description: Sign-in required or invalid login}
        '403': {description: Action outside the account scope or invalid confirmation token}
        '409': {description: Conflicting record, duplicate identifier or invalid linked record}
  /api/v1/employees:
    get:
      summary: Search employee profiles
      parameters:
        - name: search
          in: query
          required: false
          schema: {type: string}
        - name: department
          in: query
          required: false
          schema: {type: string}
      responses:
        '200': {description: Successful request}
        '503': {description: Local database or service unavailable}
        '400': {description: Invalid input}
        '401': {description: Sign-in required or invalid login}
        '403': {description: Action outside the account scope or invalid confirmation token}
    post:
      summary: Create employee and initial employment event (HR Admin)
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeInput'
      responses:
        '200': {description: Successful request}
        '503': {description: Local database or service unavailable}
        '400': {description: Invalid input}
        '401': {description: Sign-in required or invalid login}
        '403': {description: Action outside the account scope or invalid confirmation token}
        '409': {description: Conflicting record, duplicate identifier or invalid linked record}
  /api/v1/employees/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    put:
      summary: Update employee profile and record a dated status or department change (HR Admin)
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeInput'
      responses:
        '200': {description: Successful request}
        '503': {description: Local database or service unavailable}
        '400': {description: Invalid input}
        '401': {description: Sign-in required or invalid login}
        '403': {description: Action outside the account scope or invalid confirmation token}
        '409': {description: Conflicting record, duplicate identifier or invalid linked record}
  /api/v1/employees/{id}/history:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    get:
      summary: Get visible employment events
      responses:
        '200': {description: Successful request}
        '503': {description: Local database or service unavailable}
        '400': {description: Invalid input}
        '401': {description: Sign-in required or invalid login}
        '403': {description: Action outside the account scope or invalid confirmation token}
    post:
      summary: Initialize employment history with an observed profile snapshot (HR Admin)
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                effectiveOn: {type: string, format: date}
      responses:
        '200': {description: Snapshot recorded}
        '400': {description: Invalid date or existing history}
        '403': {description: HR Admin and a confirmation token are required}
  /api/v1/compensation:
    get:
      summary: Get effective-dated compensation in scope
      responses:
        '200': {description: Successful request}
        '503': {description: Local database or service unavailable}
        '400': {description: Invalid input}
        '401': {description: Sign-in required or invalid login}
        '403': {description: Action outside the account scope or invalid confirmation token}
    post:
      summary: Record compensation (HR Admin)
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayInput'
      responses:
        '200': {description: Successful request}
        '503': {description: Local database or service unavailable}
        '400': {description: Invalid input}
        '401': {description: Sign-in required or invalid login}
        '403': {description: Action outside the account scope or invalid confirmation token}
        '409': {description: Conflicting record, duplicate identifier or invalid linked record}
  /api/v1/promotions:
