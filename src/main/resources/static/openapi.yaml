components:
  securitySchemes:
    sessionCookie: {type: apiKey, in: cookie, name: JSESSIONID}
    csrfHeader: {type: apiKey, in: header, name: X-CSRF-Token}
  schemas:
    Credentials:
      type: object
      properties:
        organization: {type: string}
        username: {type: string}
        password: {type: string, format: password}
    AccountInput:
      type: object
      properties:
        username: {type: string}
        password: {type: string, format: password}
        role: {type: string}
        departmentId: {type: string}
    DepartmentInput:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
    EmployeeInput:
      type: object
      properties:
        id: {type: string}
        departmentId: {type: string}
        name: {type: string}
        job: {type: string}
        level: {type: string}
        demographic: {type: string}
        workLocation: {type: string}
        employmentType: {type: string}
        effectiveOn: {type: string, format: date}
        status: {type: string}
    PayInput:
      type: object
      properties:
        employeeId: {type: string}
        effectiveOn: {type: string, format: date}
        amount: {type: number}
        currency: {type: string}
        basis: {type: string}
        fte: {type: number}
    Promotion:
      type: object
      properties:
        employeeId: {type: string}
        effectiveOn: {type: string, format: date}
        level: {type: string}
    Requisition:
      type: object
      properties:
        id: {type: string}
        departmentId: {type: string}
        job: {type: string}
        openedOn: {type: string, format: date}
        responsible: {type: string}
    Application:
      type: object
      properties:
        id: {type: string}
        requisitionId: {type: string}
        candidateId: {type: string}
        candidateName: {type: string}
        appliedOn: {type: string, format: date}
    Transition:
      type: object
      properties:
        stage: {type: string}
        date: {type: string, format: date}
        reason: {type: string}
        employeeId: {type: string}
        jobLevel: {type: string}
    FinanceInput:
      type: object
      properties:
        from: {type: string, format: date}
        through: {type: string, format: date}
        currency: {type: string}
        recruitingCost: {type: number}
        employeeCost: {type: number}
        revenue: {type: number}
    Attendance:
      type: object
      properties:
        employeeId: {type: string}
        date: {type: string, format: date}
        scheduled: {type: number}
        absence: {type: number}
    Survey:
      type: object
      properties:
        id: {type: string}
        version: {type: integer}
        departmentId: {type: string}
        kind: {type: string}
        question: {type: string}
    Response:
      type: object
      properties:
        id: {type: string}
        version: {type: integer}
        date: {type: string, format: date}
        scores: {type: array, items: {type: integer}}
    Outcome:
      type: object
      properties:
        applicationId: {type: string}
        measuredOn: {type: string, format: date}
        performance: {type: number}
        managerScore: {type: number}
        retained: {type: boolean}
    Settings:
      type: object
      properties:
        surveyMinimum: {type: integer}
        payMinimum: {type: integer}
        tenureYears: {type: integer}
        performanceWeight: {type: integer}
        managerWeight: {type: integer}
        retentionWeight: {type: integer}
    Coverage:
      type: object
      properties:
        departmentId: {type: string}
        from: {type: string, format: date}
        through: {type: string, format: date}
    ImportInput:
      type: object
      properties:
        kind: {type: string}
        csv: {type: string}
        departmentId: {type: string}
        currency: {type: string}
        fte: {type: number}
        snapshot: {type: string, format: date}
        expectedHash: {type: string}
