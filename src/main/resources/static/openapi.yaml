        '403': {description: Action outside the account scope or invalid confirmation token}
  /api/v1/finance:
    get:
      summary: List financial periods (Finance and HR Admin)
      responses:
        '200': {description: Successful request}
        '503': {description: Local database or service unavailable}
        '400': {description: Invalid input}
        '401': {description: Sign-in required or invalid login}
        '403': {description: Action outside the account scope or invalid confirmation token}
    post:
      summary: Save period costs and revenue (Finance and HR Admin)
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinanceInput'
      responses:
        '200': {description: Successful request}
        '503': {description: Local database or service unavailable}
        '400': {description: Invalid input}
        '401': {description: Sign-in required or invalid login}
        '403': {description: Action outside the account scope or invalid confirmation token}
        '409': {description: Conflicting record, duplicate identifier or invalid linked record}
  /api/v1/attendance:
    post:
      summary: Save scheduled hours and unplanned absence (HR Admin)
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Attendance'
      responses:
        '200': {description: Successful request}
        '503': {description: Local database or service unavailable}
        '400': {description: Invalid input}
        '401': {description: Sign-in required or invalid login}
        '403': {description: Action outside the account scope or invalid confirmation token}
        '409': {description: Conflicting record, duplicate identifier or invalid linked record}
  /api/v1/surveys:
    get:
      summary: List visible survey versions
      responses:
        '200': {description: Successful request}
        '503': {description: Local database or service unavailable}
        '400': {description: Invalid input}
        '401': {description: Sign-in required or invalid login}
        '403': {description: Action outside the account scope or invalid confirmation token}
    post:
      summary: Create a versioned survey (HR Admin)
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Survey'
      responses:
        '200': {description: Successful request}
        '503': {description: Local database or service unavailable}
        '400': {description: Invalid input}
        '401': {description: Sign-in required or invalid login}
        '403': {description: Action outside the account scope or invalid confirmation token}
        '409': {description: Conflicting record, duplicate identifier or invalid linked record}
  /api/v1/survey-responses:
    post:
      summary: Enter anonymous survey scores (HR Admin)
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Response'
      responses:
        '200': {description: Successful request}
        '503': {description: Local database or service unavailable}
        '400': {description: Invalid input}
        '401': {description: Sign-in required or invalid login}
        '403': {description: Action outside the account scope or invalid confirmation token}
        '409': {description: Conflicting record, duplicate identifier or invalid linked record}
  /api/v1/outcomes:
    post:
      summary: Record post-hire outcomes (HR Admin)
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Outcome'
      responses:
        '200': {description: Successful request}
        '503': {description: Local database or service unavailable}
        '400': {description: Invalid input}
        '401': {description: Sign-in required or invalid login}
        '403': {description: Action outside the account scope or invalid confirmation token}
        '409': {description: Conflicting record, duplicate identifier or invalid linked record}
  /api/v1/metric-settings:
    get:
      summary: Get reporting policy (HR Admin)
      responses:
        '200': {description: Successful request}
        '503': {description: Local database or service unavailable}
        '400': {description: Invalid input}
        '401': {description: Sign-in required or invalid login}
        '403': {description: Action outside the account scope or invalid confirmation token}
    put:
      summary: Save reporting policy (HR Admin)
      security:
        - sessionCookie: []
