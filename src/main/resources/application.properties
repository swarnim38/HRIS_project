server.address=127.0.0.1
server.port=${HRIS_PORT:8080}
spring.datasource.url=${HRIS_DB_URL:jdbc:mysql://127.0.0.1:3307/talentcompass}
spring.datasource.username=${HRIS_DB_USER:talentcompass}
spring.datasource.password=${HRIS_DB_PASSWORD}
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=2000
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.connect-retries=0
spring.web.resources.add-mappings=true
spring.mvc.problemdetails.enabled=true
logging.level.org.springframework.boot.SpringApplication=OFF
server.error.include-message=never
server.error.include-stacktrace=never
spring.web.resources.static-locations=file:./frontend/out/,classpath:/static/
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=30m
server.forward-headers-strategy=none
server.servlet.session.tracking-modes=cookie
