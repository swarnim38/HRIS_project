services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: talentcompass
      MYSQL_USER: talentcompass
      MYSQL_PASSWORD: ${HRIS_DB_PASSWORD:?Set HRIS_DB_PASSWORD in the current shell}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    ports:
      - "127.0.0.1:${HRIS_MYSQL_PORT:-3307}:3306"
    volumes:
      - talentcompass-db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u \"$$MYSQL_USER\" talentcompass -e 'SELECT 1'"]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  talentcompass-db:
